<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Owl eval · Label clips</title>
    <style>
      /* Owl's tokens (src/styles/theme.css), copied so this page needs no build step. */
      :root {
        --bg: #fafafa;
        --surface: #fff;
        --raised: #f4f4f5;
        --border: #e4e4e7;
        --text: #27272a;
        --muted: #71717a;
        --accent: #2563eb;
        --fill: #1d4ed8;
        --ok: #059669;
        --warn: #b45309;
        --mark: rgb(217 119 6 / 18%);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --surface: #0f0f10;
          --raised: #1c1d1f;
          --border: rgb(255 255 255 / 8%);
          --text: #f1f3f7;
          --muted: #888b91;
          --accent: #4c8dff;
          --fill: #2257d6;
          --ok: #34d399;
          --warn: #fbbf24;
          --mark: rgb(251 191 36 / 20%);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100vh;
      }
      aside {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .head h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .bar {
        height: 4px;
        background: var(--raised);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar div {
        height: 100%;
        background: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .filters {
        display: flex;
        gap: 4px;
        margin-top: 10px;
        background: var(--raised);
        padding: 2px;
        border-radius: 999px;
      }
      .filters button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--muted);
        padding: 3px 0;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
      }
      .filters button.on {
        background: var(--surface);
        color: var(--text);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 4px 0;
        overflow-y: auto;
        flex: 1;
      }
      li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 16px;
        cursor: pointer;
      }
      li:hover {
        background: var(--raised);
      }
      li.cur {
        background: var(--raised);
        box-shadow: inset 2px 0 var(--accent);
      }
      li .n {
        color: var(--muted);
        width: 26px;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      li .t {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      li .s {
        flex-shrink: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid var(--muted);
        align-self: center;
      }
      li .s.done {
        background: var(--ok);
        border-color: var(--ok);
      }
      li .s.skip {
        background: var(--muted);
      }
      main {
        overflow-y: auto;
        padding: 24px 32px 64px;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .top h2 {
        font-size: 16px;
        margin: 0;
      }
      .chip {
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--raised);
        color: var(--muted);
      }
      .chip.warn {
        color: var(--warn);
      }
      audio {
        width: 100%;
        margin-bottom: 20px;
      }
      section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      section h3 {
        font-size: 13px;
        margin: 0 0 2px;
      }
      section > p {
        margin: 0 0 12px;
      }
      .src {
        display: grid;
        grid-template-columns: 110px 1fr auto;
        gap: 8px;
        align-items: baseline;
        padding: 6px 0;
        border-top: 1px solid var(--border);
      }
      .src:first-of-type {
        border-top: 0;
      }
      .src .who {
        color: var(--muted);
      }
      mark {
        background: var(--mark);
        color: inherit;
        border-radius: 3px;
        padding: 0 2px;
      }
      textarea {
        width: 100%;
        margin-top: 10px;
        padding: 8px 10px;
        font: 14px/1.5 inherit;
        font-family: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        resize: vertical;
        min-height: 64px;
      }
      textarea:focus,
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      input {
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      button.ghost {
        border: 1px solid var(--border);
        background: var(--raised);
        color: var(--text);
        border-radius: 6px;
        padding: 2px 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .actions .hint {
        margin-right: auto;
      }
      .btn {
        border: 1px solid var(--border);
        background: var(--raised);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 14px;
        font: inherit;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--fill);
        color: #fff;
        border-color: transparent;
        box-shadow: inset 0 1px rgb(255 255 255 / 16%);
      }
      kbd {
        font:
          11px ui-monospace,
          monospace;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--raised);
      }
      .toast {
        position: fixed;
        bottom: 16px;
        right: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="head">
          <h1>Label clips</h1>
          <div class="bar"><div id="bar"></div></div>
          <div class="small muted" id="progress" style="margin-top: 6px"></div>
          <div class="filters" id="filters">
            <button data-f="todo" class="on">To do</button
            ><button data-f="done">Done</button
            ><button data-f="all">All</button>
          </div>
        </div>
        <ol id="list"></ol>
      </aside>
      <main><div class="wrap" id="main"></div></main>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      const GOAL = 50;
      let clips = [],
        run = null,
        cur = 0,
        filter = "todo";
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        (s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const norm = (w) => w.toLowerCase().replace(/[^\p{L}\p{N}']/gu, "");
      const state = (c) => c.label?.status ?? "todo";

      // Word diff by longest common subsequence; returns each side's words with a "differs" flag.
      // shortcut: splits on spaces, so Chinese text is diffed as whole phrases; fine while the set is English.
      function diff(a, b) {
        const x = (a ?? "").split(/\s+/).filter(Boolean),
          y = (b ?? "").split(/\s+/).filter(Boolean);
        const nx = x.map(norm),
          ny = y.map(norm);
        const L = Array.from({ length: x.length + 1 }, () =>
          new Array(y.length + 1).fill(0),
        );
        for (let i = x.length - 1; i >= 0; i--)
          for (let j = y.length - 1; j >= 0; j--)
            L[i][j] =
              nx[i] === ny[j]
                ? L[i + 1][j + 1] + 1
                : Math.max(L[i + 1][j], L[i][j + 1]);
        const dx = x.map(() => true),
          dy = y.map(() => true);
        for (let i = 0, j = 0; i < x.length && j < y.length; ) {
          if (nx[i] === ny[j]) {
            dx[i] = dy[j] = false;
            i++;
            j++;
          } else if (L[i + 1][j] >= L[i][j + 1]) i++;
          else j++;
        }
        nx.forEach((w, i) => {
          if (!w) dx[i] = false;
        });
        ny.forEach((w, j) => {
          if (!w) dy[j] = false;
        });
        const show = (ws, d) =>
          ws
            .map((w, i) => (d[i] ? `<mark>${esc(w)}</mark>` : esc(w)))
            .join(" ");
        return [show(x, dx), show(y, dy), dx.some(Boolean) || dy.some(Boolean)];
      }

      function renderList() {
        const done = clips.filter((c) => state(c) === "done").length;
        $("bar").style.width = `${Math.min(100, (done / GOAL) * 100)}%`;
        $("progress").textContent =
          `${done} of ${GOAL} labeled · ${clips.length} clips · Owl text from ${run ?? "no run"}`;
        document
          .querySelectorAll("#filters button")
          .forEach((b) => b.classList.toggle("on", b.dataset.f === filter));
        $("list").innerHTML = clips
          .map((c, i) => ({ c, i }))
          .filter(
            ({ c }) =>
              filter === "all" ||
              (filter === "todo" ? state(c) === "todo" : state(c) !== "todo"),
          )
          .map(
            ({
              c,
              i,
            }) => `<li data-i="${i}" class="${i === cur ? "cur" : ""}"><span class="n">${i + 1}</span>
      <span class="t">${esc(c.label?.verbatim || c.wispr_raw)}</span><span class="s ${state(c)}"></span></li>`,
          )
          .join("");
        $("list").querySelector(".cur")?.scrollIntoView({ block: "nearest" });
      }

      function source(who, html, text, target) {
        return `<div class="src"><span class="who">${who}</span><span>${html || '<span class="muted">(nothing)</span>'}</span>
    ${text != null ? `<button class="ghost" data-use="${target}" data-text="${esc(text)}">Use</button>` : "<span></span>"}</div>`;
      }

      function renderClip() {
        const c = clips[cur];
        if (!c) {
          $("main").innerHTML = '<p class="muted">No clips.</p>';
          return;
        }
        const [wr, or, rawDiffers] = diff(c.wispr_raw, c.owl_raw);
        const [kept, of] = diff(c.kept, c.owl_final);
        $("main").innerHTML = `
    <div class="top"><h2>Clip ${cur + 1}</h2><span class="chip">${c.secs.toFixed(1)} s</span>
      <span class="chip">${esc(c.when.slice(0, 16))}</span>
      ${rawDiffers ? '<span class="chip warn">Wispr and Owl disagree</span>' : '<span class="chip">Wispr and Owl agree</span>'}
      ${state(c) !== "todo" ? `<span class="chip">${state(c) === "done" ? "Labeled" : "Skipped"}</span>` : ""}</div>
    <audio id="audio" controls src="/audio/${c.wav}"></audio>
    <section>
      <h3>What you said</h3>
      <p class="small muted">Every word you spoke, including false starts and "no wait". Leave out um and uh. Punctuation and capitals don't count.</p>
      ${source("Wispr heard", wr, c.wispr_raw, "verbatim")}
      ${source("Owl heard", or, c.owl_raw, "verbatim")}
      <textarea id="verbatim" rows="3">${esc(c.label?.verbatim ?? c.wispr_raw)}</textarea>
    </section>
    <section>
      <h3>What you wanted typed</h3>
      <p class="small muted">The finished text: fillers out, corrections applied, names right. Delete anything you typed in by hand afterwards.</p>
      ${source(c.edited ? "You kept (edited)" : "You kept", kept, c.kept, "clean")}
      ${source("Owl's cleanup", of, c.owl_final, "clean")}
      <textarea id="clean" rows="3">${esc(c.label?.clean ?? c.kept)}</textarea>
    </section>
    <input id="note" placeholder="Note (optional): what's tricky about this clip" value="${esc(c.label?.note ?? "")}">
    <div class="actions">
      <span class="hint small muted"><kbd>⌘↵</kbd> save and next · <kbd>⌥R</kbd> replay · <kbd>Esc</kbd> then <kbd>J</kbd>/<kbd>K</kbd> move</span>
      <button class="btn" id="skip">Skip (can't tell)</button>
      <button class="btn primary" id="save">Save and next</button>
    </div>`;
        $("save").onclick = () => save("done");
        $("skip").onclick = () => save("skip");
        $("main")
          .querySelectorAll("[data-use]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                $(b.dataset.use).value = b.dataset.text;
              }),
          );
        $("audio")
          .play()
          .catch(() => {});
      }

      function go(i) {
        cur = Math.max(0, Math.min(clips.length - 1, i));
        renderList();
        renderClip();
      }

      async function save(status) {
        const body = {
          id: clips[cur].id,
          status,
          verbatim: $("verbatim").value,
          clean: $("clean").value,
          note: $("note").value,
        };
        if (status === "done" && (!body.verbatim.trim() || !body.clean.trim()))
          return toast("Fill in both answers, or skip the clip.");
        const r = await fetch("/api/label", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!r.ok) return toast(`Not saved: ${await r.text()}`);
        clips[cur].label = await r.json();
        const next = clips.findIndex((c, i) => i > cur && state(c) === "todo");
        go(next === -1 ? cur : next);
        toast(status === "done" ? "Saved" : "Skipped");
      }

      let toastTimer;
      function toast(msg) {
        $("toast").textContent = msg;
        $("toast").style.display = "block";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => ($("toast").style.display = "none"),
          1600,
        );
      }

      $("list").onclick = (e) => {
        const li = e.target.closest("li");
        if (li) go(+li.dataset.i);
      };
      $("filters").onclick = (e) => {
        if (e.target.dataset.f) {
          filter = e.target.dataset.f;
          renderList();
        }
      };
      document.addEventListener("keydown", (e) => {
        const typing = ["TEXTAREA", "INPUT"].includes(
          document.activeElement?.tagName,
        );
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          e.preventDefault();
          save("done");
        } else if (e.altKey && e.code === "KeyR") {
          e.preventDefault();
          const a = $("audio");
          a.currentTime = 0;
          a.play();
        } else if (e.key === "Escape") document.activeElement?.blur();
        else if (!typing && e.key === "j") go(cur + 1);
        else if (!typing && e.key === "k") go(cur - 1);
      });

      fetch("/api/clips")
        .then((r) => r.json())
        .then((d) => {
          clips = d.clips;
          run = d.run;
          const first = clips.findIndex((c) => state(c) === "todo");
          go(first === -1 ? 0 : first);
        });
    </script>
  </body>
</html>
